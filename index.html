<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Методичка до уроку</title>
<style>
  :root{--bg:#eef2f7;--card:#fff;--text:#17202e;--muted:#7b8798;--accent:#2a6df4;--line:#dbe2ec}
  @media (prefers-color-scheme:dark){:root{--bg:#11161f;--card:#1a212d;--text:#e8edf5;--muted:#8793a6;--accent:#5b8cff;--line:#2b3444}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px 40px;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
  h1{margin:0 0 6px;font-size:1.5rem;line-height:1.25}
  h2{margin:0 0 4px;font-size:1.2rem}
  h3{margin:22px 0 8px;font-size:1.05rem}
  a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .note{color:var(--muted);font-size:.9rem;line-height:1.5}
  .back{color:var(--accent);text-decoration:none;font-weight:600}
  ul.tips{padding-left:20px;line-height:1.55}
  details{border-top:1px solid var(--line);padding:12px 0}
  details:last-of-type{border-bottom:1px solid var(--line)}
  summary{cursor:pointer;font-weight:600}
  details ol{margin:10px 0 0;padding-left:24px;line-height:1.6}

  .head{font-size:1.3rem;font-weight:700;text-align:center;margin:4px 0 2px}
  .bar{height:6px;background:var(--line);border-radius:3px;margin:14px 0 8px;overflow:hidden}
  .bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  .steps{list-style:none;margin:0;padding:0}
  .steps li+li{border-top:1px solid var(--line)}
  .steps label{display:flex;align-items:center;gap:14px;padding:14px 4px;cursor:pointer;font-size:1.05rem}
  .steps input{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0;cursor:pointer}
  .steps input:checked+span{color:var(--muted);text-decoration:line-through}
  .section-title{margin:6px 4px -6px;font-size:1.1rem;font-weight:700}
  .link{display:flex;align-items:center;gap:16px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;color:var(--text);text-decoration:none;transition:transform .15s,border-color .15s}
  .link:hover{transform:translateY(-2px);border-color:var(--accent)}
  .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
  .i1{background:linear-gradient(135deg,#f6a623,#f2603b)}
  .i2{background:linear-gradient(135deg,#7b61ff,#2a6df4)}
  .link b{flex:1;font-size:1.05rem;line-height:1.3}
  .chev{color:var(--muted);font-size:1.4rem}
  .tg{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#2aabee,#1c7fd4);color:#fff;text-decoration:none}
  .ava{position:relative;width:60px;height:60px;border-radius:50%;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.2);display:grid;place-items:center;border:2px solid rgba(255,255,255,.7)}
  .ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tg .txt{flex:1;min-width:0}
  .tg .txt b{display:block;font-size:1.05rem;line-height:1.25}
  .tg .txt small{opacity:.9}
  .join{background:#fff;color:#1c7fd4;font-weight:700;padding:9px 14px;border-radius:999px;font-size:.9rem;white-space:nowrap}
  @media (prefers-reduced-motion:reduce){.link{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">Методичка до уроку</div>

  <main class="card">
    <h1>6 кроків створення Mini App</h1>
    <p class="note" id="progress">Виконано: 0 з 6</p>
    <div class="bar"><span id="bar"></span></div>
    <ul class="steps">
      <li><label><input type="checkbox"><span>Обрати тему</span></label></li>
      <li><label><input type="checkbox"><span>Взяти інфу від клієнта</span></label></li>
      <li><label><input type="checkbox"><span>Підключити Скіли в Claude</span></label></li>
      <li><label><input type="checkbox"><span>Поставити першу задачу</span></label></li>
      <li><label><input type="checkbox"><span>Зібрати дизайн</span></label></li>
      <li><label><input type="checkbox"><span>Підключити БОТ</span></label></li>
    </ul>
  </main>

  <div class="section-title">Додаткові матеріали</div>

  <a class="link" href="https://drive.google.com/file/d/1tOBVRT4GchdlMUjo39T8Ah2sDIH_DP4i/view?usp=sharing" target="_blank" rel="noopener">

    <b>100 напрямків бізнесів, які готові платити за Mini App</b>
    <span class="chev">›</span>
  </a>
  <a class="link" href="https://drive.google.com/file/d/1Px-6A8Ed58hQoohXWvkcT64LZ7-gTiDS/view?usp=sharing" target="_blank" rel="noopener">
    <span class="ico i1"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.3" fill="#fff"/></svg></span>
    <b>Як купувати сервіси зі знижкою до 80%</b>
    <span class="chev">›</span>
  </a>

  <a class="tg" href="https://t.me/+f60UvJQCEH9iODIy" target="_blank" rel="noopener">
    <span class="ava"><svg viewBox="0 0 24 24" width="30" height="30" fill="#fff"><path d="M21.5 3.6 2.9 10.8c-1.3.5-1.3 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.1.8.7.8.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.2-15.2c.3-1.3-.5-1.9-1.4-1.4zM8.4 13.3l9.9-6.2c.5-.3.9-.1.5.2l-8.1 7.3-.3 3.4z"/></svg><img src="https://cdn4.telesco.pe/file/cKMjTkyC-tUmuLgNmTfFuC1dbj8ITzgFBDakrPwxbAI4cu_hpMLnJtxjGXYljUaWy9hZQnRyh7JVH9UXgpAmK48X5kMeqMngNW7NyqcB1bHGXp7CxOp-iZuhISP18sV80MHYptD47Fv5MLiEmdCxVA9zVm2SbotUV3RpiTf9034nLajq2Mc__6hIzzE2Bue3daKlOghJTdraN4I1cp3Ryt51XZz4CcmqXSik56J2H3OCTeW8NnNS5skwCnVxQK8UIxnton8BiCkxZoeomI0i-i9-lj7Mvz6x6qMoWZtFbU-WnQnBDQvgrVJj_S-4Ube-OAWypIf_DTQuZ97mznDMbw.jpg" alt="" onerror="this.remove()"></span>
    <span class="txt"><b>Дмитро Соколов | Батя сайтів</b><small>Telegram-канал</small></span>
    <span class="join">Підписатися</span>
  </a>
</div>
<script>
  const boxes=document.querySelectorAll('.steps input');
  const progress=document.getElementById('progress');
  const bar=document.getElementById('bar');
  boxes.forEach(b=>b.addEventListener('change',()=>{
    const done=[...boxes].filter(x=>x.checked).length;
    progress.textContent='Виконано: '+done+' з '+boxes.length;
    bar.style.width=(done/boxes.length*100)+'%';
  }));
</script>
</body>
</html>
